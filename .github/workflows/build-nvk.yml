name: Build NVK libvulkan.a (Switch)

# Builds Mesa/NVK for Horizon from PalindromicBreadLoaf/nxvk, then packages the
# resulting archives into the single libvulkan.a that tico cores expect
# (-DSWITCH_VULKAN_LIBRARY / MESA_NVK_DIR/src/nouveau/vulkan/libvulkan.a).
#
# Upstream Mesa has no libvulkan.a target: it builds libnvk.a (static) plus
# libvulkan_nouveau.so (shared). tico links "Mesa's loaderless libvulkan.a",
# which is this repackaging step, not a stock Mesa artifact.

on:
  workflow_dispatch:
    inputs:
      nxvk_ref:
        description: nxvk git ref to build (default branch is 'switch')
        default: switch
        type: string

jobs:
  build:
    name: Build NVK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      image: devkitpro/devkita64:latest

    steps:
      # Mirrors switch/docker/Dockerfile from nxvk, run as steps so the heavy
      # bits (cargo, ccache) can be cached between runs.
      - name: System packages
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3-pip bison flex curl ca-certificates pkg-config git \
            build-essential cmake ninja-build \
            llvm-15-dev clang-15 libclang-15-dev \
            libclc-15-dev libclc-15 \
            llvm-spirv-15 libllvmspirvlib-15-dev spirv-tools \
            libdrm-dev glslang-tools
          python3 -m pip install --break-system-packages --no-cache-dir 'meson>=1.4' mako pyyaml
          meson --version
          glslangValidator --version | head -2

      - name: Cache Rust toolchain and cargo bins
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: /opt/rust
          key: nxvk-rust-nightly-bindgen-cbindgen-v1

      - name: Rust + bindgen/cbindgen
        run: |
          set -eux
          export RUSTUP_HOME=/opt/rust/rustup CARGO_HOME=/opt/rust/cargo
          export PATH="/opt/rust/cargo/bin:$PATH"
          if [ ! -x /opt/rust/cargo/bin/rustc ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain nightly --profile minimal --component rust-src
          fi
          rustup component add rustfmt || true
          # bindgen: C->Rust FFI for NAK. cbindgen: Rust->C headers for NIL.
          command -v bindgen  >/dev/null || cargo install --locked bindgen-cli
          command -v cbindgen >/dev/null || cargo install --locked cbindgen
          rustc --version; bindgen --version; cbindgen --version
          {
            echo "RUSTUP_HOME=/opt/rust/rustup"
            echo "CARGO_HOME=/opt/rust/cargo"
            echo "PATH=/opt/rust/cargo/bin:$PATH"
            echo "LLVM_CONFIG=/usr/bin/llvm-config-15"
            echo "LIBCLANG_PATH=/usr/lib/llvm-15/lib"
          } >> "$GITHUB_ENV"

      - name: Checkout nxvk
        uses: actions/checkout@v4
        with:
          repository: PalindromicBreadLoaf/nxvk
          ref: ${{ inputs.nxvk_ref }}
          path: nxvk
          fetch-depth: 1

      # nxvk's crossfiles and rustc wrapper hardcode /work (their podman bind
      # mount point): rust.cross points at /work/switch/rust/rustc-switch.sh and
      # the wrapper passes --sysroot /work/switch/rust/sysroot. Reproduce that
      # layout instead of patching their scripts.
      - name: Expose the tree at /work
        run: |
          set -eux
          ln -sfn "$GITHUB_WORKSPACE/nxvk" /work
          ls -la /work/switch/rust/

      - name: Cross-build plumbing
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/nxvk"
          mkdir -p /opt/switch-cross-include/libdrm
          cp /usr/include/xf86drm.h /usr/include/xf86drmMode.h /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/* /opt/switch-cross-include/ 2>/dev/null || true
          cp -r /usr/include/libdrm/* /opt/switch-cross-include/libdrm/ 2>/dev/null || true
          # nxvk's own target stubs (dlfcn.h, sys/mman.h, syslog.h, spirv-tools).
          cp -r switch/docker/cross-include/. /opt/switch-cross-include/
          # Host CLC/SPIR-V .pc files, visible to the Switch cross pkg-config dir.
          XDIR=/opt/devkitpro/portlibs/switch/lib/pkgconfig; mkdir -p "$XDIR"
          for name in libclc LLVMSPIRVLib SPIRV-Tools SPIRV-Tools-shared SPIRV-Headers; do
            f=$(find /usr -name "$name.pc" 2>/dev/null | head -1)
            [ -n "$f" ] && cp "$f" "$XDIR/" && echo "baked $f"
          done
          # Static dlopen fallbacks want a libdl.
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-ar rcs \
            /opt/devkitpro/portlibs/switch/lib/libdl.a
          ls /opt/switch-cross-include/ | head

      # Undocumented but required: rustc-switch.sh passes an explicit
      # --sysroot, so the Rust std for the custom aarch64-switch-horizon
      # target has to exist before meson probes the Rust compiler.
      - name: Build Rust std sysroot for aarch64-switch-horizon
        run: |
          set -eux
          cd /work
          bash switch/rust/build-std-sysroot.sh

      - name: Build native tools (mesa_clc, vtn_bindgen2)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/nxvk"
          bash switch/build/build-native-tools.sh

      - name: Cross-configure Mesa for Horizon
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/nxvk"
          bash switch/build/configure-mesa.sh

      - name: Build NVK archives
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/nxvk"
          # The final libvulkan_nouveau.so link is expected to fail on Horizon;
          # -k0 forces every lib*.a to build regardless. Per nxvk's README.
          ninja -k0 -C switch/build/cross src/nouveau/vulkan/libvulkan_nouveau.so || true
          echo "--- archives produced ---"
          find switch/build/cross -name '*.a' | sort
          test -f switch/build/cross/src/nouveau/vulkan/libnvk.a

      - name: Package libvulkan.a
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/nxvk/switch/build/cross"
          DKP=/opt/devkitpro
          LD=$DKP/devkitA64/bin/aarch64-none-elf-ld
          OBJCOPY=$DKP/devkitA64/bin/aarch64-none-elf-objcopy
          AR=$DKP/devkitA64/bin/aarch64-none-elf-ar
          NM=$DKP/devkitA64/bin/aarch64-none-elf-nm

          # Archive names drift between Mesa versions (25.0.7 has liblibnil.a and
          # libmesa_util_sse41.a where 26.x differs), so discover them instead of
          # hardcoding. --start-group below makes order irrelevant, and libnvk
          # itself is whole-archived separately.
          #
          # This deliberately includes libnouveau_codegen.a (nv50_ir), which
          # nxvk's own 26.x link line omits: on Mesa 25.x, NVK still routes
          # pre-Turing GPUs through the legacy codegen (nvk_cg_compile_nir ->
          # nv50_ir_generate_code), and the Switch's GM20B is Maxwell.
          present=$(find src -name '*.a' ! -name 'libnvk.a' | sort | tr '\n' ' ')
          echo "--- support archives ---"; echo "$present" | tr ' ' '\n' | grep .

          # Mesa's xmlconfig parses driconf through expat. Bundle it so the
          # result is self-contained: tico's cores add only -ldrm_nouveau/-lzstd/-lz
          # to their link lines, never -lexpat.
          EXPAT=$DKP/portlibs/switch/lib/libexpat.a
          [ -f "$EXPAT" ] || { echo "::error::missing $EXPAT (need switch-libexpat)"; exit 1; }

          # --start-group resolves the cyclic references between Mesa archives.
          # libnvk must be whole-archived or the entrypoints get dropped.
          # shellcheck disable=SC2086
          "$LD" -r \
            --whole-archive src/nouveau/vulkan/libnvk.a --no-whole-archive \
            --start-group $present "$EXPAT" --end-group \
            -o /tmp/libnvk_merged.o

          echo "=== Vulkan entry points present in the merged object ==="
          "$NM" --defined-only /tmp/libnvk_merged.o \
            | grep -iE " (T|W) .*(vkGetInstanceProcAddr|vk_icdGetInstanceProcAddr|vk_icdNegotiate|vkCreateInstance|vkEnumerateInstance)" \
            | sort -u | tee /tmp/entrypoints.txt || true

          if grep -qE " (T|W) vkGetInstanceProcAddr$" /tmp/entrypoints.txt; then
            echo "Standard vkGetInstanceProcAddr already exported; no shim needed."
            KEEP="--keep-global-symbol=vkGetInstanceProcAddr"
            NEED_SHIM=0
          else
            echo "Only the ICD entry point is exported; adding the loaderless shim."
            KEEP=""
            NEED_SHIM=1
          fi
          echo "NEED_SHIM=$NEED_SHIM" >> "$GITHUB_ENV"

          # Hide Mesa's symbols so they cannot collide with the consumer's own
          # dispatch table (PPSSPP declares globals literally named vkCreateInstance
          # and friends), while keeping the entry points reachable.
          #
          # Localize only STRONG globals (T/D/B). Weak symbols (W/V) are C++ COMDAT
          # template instantiations living in link-once section groups: localizing
          # those breaks the group semantics and the link fails with "defined in
          # discarded section" once --gc-sections runs.
          KEEP_RE='^(vkGetInstanceProcAddr|vk_icdGetInstanceProcAddr|vk_icdNegotiateLoaderICDInterfaceVersion|vk_icdGetPhysicalDeviceProcAddr)$'
          "$NM" --defined-only --extern-only /tmp/libnvk_merged.o \
            | awk '$2 ~ /^[TDBRtdbr]$/ && $3 != "" {print $3}' \
            | grep -vE "$KEEP_RE" | sort -u > /tmp/localize.txt
          echo "localizing $(wc -l < /tmp/localize.txt) strong global symbols"
          "$OBJCOPY" --localize-symbols=/tmp/localize.txt \
            /tmp/libnvk_merged.o /tmp/libnvk_local.o

          # Mesa exports only the ICD entry point. tico cores declare the standard
          # name instead (VulkanLoader.cpp: __asm__("vkGetInstanceProcAddr")), so
          # forward one to the other. VKAPI_ATTR/VKAPI_CALL are empty on aarch64,
          # which makes this plain C declaration ABI-compatible.
          SHIM_OBJ=""
          if [ "$NEED_SHIM" = "1" ]; then
            cat > /tmp/vk_loaderless_shim.c <<'EOF'
          typedef void (*PFN_vkVoidFunction)(void);
          typedef struct VkInstance_T *VkInstance;

          PFN_vkVoidFunction vk_icdGetInstanceProcAddr(VkInstance instance, const char *pName);

          PFN_vkVoidFunction vkGetInstanceProcAddr(VkInstance instance, const char *pName)
          {
            return vk_icdGetInstanceProcAddr(instance, pName);
          }
          EOF
            $DKP/devkitA64/bin/aarch64-none-elf-gcc \
              -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -O2 \
              -ffunction-sections -fdata-sections -D__SWITCH__ \
              -c /tmp/vk_loaderless_shim.c -o /tmp/vk_loaderless_shim.o
            SHIM_OBJ=/tmp/vk_loaderless_shim.o
          fi

          # devkitPro's newlib has no getuid/sysconf/posix_memalign/regex/getrandom,
          # which Mesa and the Rust std bits in NAK reference. nxvk already ships
          # the gap fills; keep them in their own object (not localized) so the
          # symbols stay available to whatever links this archive.
          $DKP/devkitA64/bin/aarch64-none-elf-gcc \
            -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE -O2 \
            -ffunction-sections -fdata-sections -D__SWITCH__ -D_GNU_SOURCE \
            -I$DKP/libnx/include -I$DKP/portlibs/switch/include \
            -c "$GITHUB_WORKSPACE/nxvk/switch/smoke/nvk_compat.c" -o /tmp/nvk_compat.o

          mkdir -p "$GITHUB_WORKSPACE/out/lib" "$GITHUB_WORKSPACE/out/include"
          # shellcheck disable=SC2086
          "$AR" rcs "$GITHUB_WORKSPACE/out/lib/libvulkan.a" \
            /tmp/libnvk_local.o /tmp/nvk_compat.o $SHIM_OBJ
          cp -r "$GITHUB_WORKSPACE/nxvk/include/vulkan" "$GITHUB_WORKSPACE/out/include/" 2>/dev/null || true
          cp /tmp/entrypoints.txt "$GITHUB_WORKSPACE/out/entrypoints.txt"

          echo "=== global symbols in the packaged libvulkan.a ==="
          "$NM" --defined-only --extern-only "$GITHUB_WORKSPACE/out/lib/libvulkan.a" \
            | grep -E " (T|W) " | sort -u | tee "$GITHUB_WORKSPACE/out/exported-symbols.txt"

          # Both names must resolve or the cores will not link.
          grep -qE " (T|W) vkGetInstanceProcAddr$"     "$GITHUB_WORKSPACE/out/exported-symbols.txt"
          grep -qE " (T|W) vk_icdGetInstanceProcAddr$" "$GITHUB_WORKSPACE/out/exported-symbols.txt"
          echo "OK: libvulkan.a exports vkGetInstanceProcAddr and vk_icdGetInstanceProcAddr"

          cd "$GITHUB_WORKSPACE/out"
          sha256sum lib/libvulkan.a | tee lib/libvulkan.a.sha256
          ls -laR . | head -40

      - name: Summary
        if: always()
        run: |
          {
            echo "## NVK build"
            echo ""
            echo '### Exported Vulkan entry points'
            echo '```'
            cat /tmp/entrypoints.txt 2>/dev/null || echo "(build did not reach this step)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload libvulkan.a
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvk-switch-libvulkan
          path: out/
          if-no-files-found: warn

      - name: Upload meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nvk-meson-logs
          path: |
            nxvk/switch/build/cross/meson-logs/
            nxvk/switch/build/native/meson-logs/
          if-no-files-found: ignore
